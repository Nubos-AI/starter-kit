services:
    laravel.test:
        ports: !reset []
        environment:
            TRUSTED_PROXIES: '${TRUSTED_PROXIES:-172.16.0.0/12}'
    caddy:
        image: 'caddy:2.10.2'
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        environment:
            TENANT_TLS_ASK_TOKEN: '${TENANT_TLS_ASK_TOKEN}'
            TLS_ACME_EMAIL: '${TLS_ACME_EMAIL}'
        volumes:
            - './docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro'
            - 'sail-caddy-data:/data'
            - 'sail-caddy-config:/config'
        networks:
            - sail
        depends_on:
            - laravel.test
volumes:
    sail-caddy-data:
        driver: local
    sail-caddy-config:
        driver: local
